[mod-setting-name]
better-space-platform-recipe-steel-cost=Steel Cost
better-space-platform-recipe-copper-cable-cost=Copper Cable Cost
better-space-platform-recipe-energy-required=Crafting Time (seconds)
better-space-platform-recipe-amount-crafted=Amount Crafted
better-space-platform-item-weight=Weight (kg)
better-space-platform-item-stack-size=Stack Size

[mod-setting-description]
better-space-platform-recipe-steel-cost=Vanilla default of 20. Mod default of 5. This is how many steel plates each craft uses.
better-space-platform-recipe-copper-cable-cost=Vanilla default of 20. Mod default of 5. This is how many copper cable each craft uses.
better-space-platform-recipe-energy-required=Vanilla default of 10. Mod default of 2.5. This is the seconds per craft.
better-space-platform-recipe-amount-crafted=Vanilla and Mod default of 1. This is how many items are created per craft.
better-space-platform-item-weight=Vanilla default of 20. Mod default of 5. This is how much each item weighs, a rocket can hold 1000kg total.
better-space-platform-item-stack-size=Vanilla and Mod default of 100. This is how many items fit in a single inventory slot.

